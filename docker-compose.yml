version: '3.8'

services:
  web:
    build: .
    ports:
      - "8081:8080"
    volumes:
      - .:/app
      - ./reports:/app/reports
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app:app --host 0.0.0.0 --port 8080 --reload
    restart: unless-stopped 